; ESP32 DevKit (original ESP32-D, Xtensa LX6 @ 240 MHz), Arduino core as in the RSA project. The vendored PQClean sources are compiled in place.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = huge_app.csv
build_unflags = -Os
build_flags =
    -O3 -ffp-contract=off -fno-stack-protector -DCORE_DEBUG_LEVEL=0 -DKRON_NO_SW
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../vendor/pqclean/common
    -I${PROJECT_DIR}/../vendor/pqclean/crypto_kem
    -I${PROJECT_DIR}/../vendor/pqclean/crypto_sign
board_build.f_flash = 80000000L
build_src_filter =
    +<*>
    +<../../vendor/pqclean/common/fips202.c>
    +<../../vendor/pqclean/crypto_kem/ml-kem-768/clean/*.c>
    +<../../vendor/pqclean/crypto_sign/ml-dsa-44/clean/*.c>
    +<../../vendor/pqclean/crypto_sign/falcon-512/clean/*.c>
    -<../../vendor/pqclean/crypto_sign/falcon-512/clean/vrfy.c>
